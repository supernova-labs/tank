[project]
name = "tank"
version = "0.1.0"
description = "Make your content accessible to agents — and prove it is being used well. Ontology-as-code contracts and a deterministic validator (tank check) for SurrealDB-backed projects."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "surrealdb>=1.0.4",
]

[project.scripts]
tank = "tank.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tank"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Frozen experiment data: what agents actually wrote, under the prompts of their
# round. Formatting or "fixing" it would rewrite the record.
extend-exclude = ["evals/*/runs/"]
